# ramani: .pre-commit-config.yaml
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: unsupported
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ramani
        name: ramani
        entry: uv run ramani
        language: unsupported
        always_run: true # file moves and deletions must trigger it too
        pass_filenames: false
        require_serial: true

      # Needs uv's `format-command` preview feature (see [tool.uv] in pyproject.toml).
      # Behavior may change between uv releases; alternative: `uv run ruff format`.
      - id: uv-format
        name: uv format
        entry: uv format
        language: unsupported
        types: [python]
        pass_filenames: false # formats the whole project, not just staged files
        require_serial: true

      - id: djlint-format
        name: djlint . --reformat
        entry: djlint . --reformat
        language: unsupported
        types: [html]
        pass_filenames: false

      # Needs uv's `check-command` preview feature (see [tool.uv] in pyproject.toml).
      # Behavior may change between uv releases; alternative: `uv run ruff check --fix`.
      - id: uv-check
        name: uv check
        entry: uv check
        language: unsupported
        types: [python]
        pass_filenames: false

      - id: djlint-lint
        name: djlint . --lint
        entry: djlint . --lint
        language: unsupported
        types: [html]
        pass_filenames: false
