# ramani: pyproject.toml
[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project]
name = "djangX"
version = "0.1.0a3"
description = "Write the app, djangX wires the rest: auto-discovered apps and URLs, built-in Sass and Bootstrap, CSP on by default and ready-made deploys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
maintainers = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.14"
keywords = ["djangx", "django", "framework", "web-framework","bootstrap", "sass", "scss", "cli", "uv", "scaffolding", "pypi", "treeolive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=6.1.3",
    "django-browser-reload>=1.21.0",
    "django-http-compression[brotli]>=1.4.0",
    "djangorestframework>=3.18.3",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.3.8"]
vercel = ["vercel>=0.12.2"]

[project.scripts]
djangx = "djangx.core.management.cli:main"
djx = "djangx.core.management.cli:main"

[project.urls]
Repository = "https://github.com/treeolive-tech/djangx.git"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djlint>=1.49.10",
    "pre-commit>=4.7.0",
    "ramani>=0.1.0",
]

[tool.uv]
preview-features = ["format-command", "check-command"]

[tool.ruff]
exclude = ["*/migrations/*"]

[tool.djlint]
format_css = true
format_js = true
blank_line_before_tag = "block,list"
blank_line_after_tag = "endblock,endlist"
ignore = "H016,H030,H031"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
